# Production stack for a single cloud server.
# Runs the backend (API) + frontend (nginx serving the app and proxying /api).
# The database stays on Neon (already cloud) — see DATABASE_URL in .env.production.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      TRUST_PROXY: "1"
    expose:
      - "4000"
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
